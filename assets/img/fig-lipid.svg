<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 318" width="780" height="318" role="img" aria-label="Schematic forest plot of a meta-analysis: individual study estimates with confidence intervals, sized by weight, summarised by a pooled diamond favouring lipid emulsion but with an interval that crosses close to no effect.">
  <style>
    .ink    { fill: #17191c; }
    .muted  { fill: #767c85; }
    .rule   { stroke: #e0dfda; stroke-width: 1; fill: none; }
    .hair   { stroke: #c9c8c3; stroke-width: 1; fill: none; }
    .mark   { fill: #1c4f7c; }
    .stroke { stroke: #1c4f7c; fill: none; }
    .soft   { fill: #1c4f7c; fill-opacity: .12; }
    .t      { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .lbl    { font-size: 13px; }
    .val    { font-size: 12px; font-variant-numeric: tabular-nums; }
    .ax     { font-size: 11px; }
    .cap    { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .ink    { fill: #e9e8e4; }
      .muted  { fill: #8d939b; }
      .rule   { stroke: #2a2e33; }
      .hair   { stroke: #3c4147; }
      .mark   { fill: #6fa8d6; }
      .stroke { stroke: #6fa8d6; }
      .soft   { fill: #6fa8d6; fill-opacity: .16; }
    }
  </style>
  <text class="t cap muted" x="0" y="24">Pooled effect across studies</text>
  <path class="hair" stroke-dasharray="4 4" d="M526.2 40 V270"/>
  <text class="t lbl muted" x="0" y="66">Model A</text>
  <path class="stroke" stroke-width="1.5" stroke-linecap="round" opacity=".65" d="M536.3 62 H720.8"/>
  <rect class="mark" opacity=".7" x="625.1" y="59.0" width="6.0" height="6.0"/>
  <text class="t lbl muted" x="0" y="96">Model B</text>
  <path class="stroke" stroke-width="1.5" stroke-linecap="round" opacity=".65" d="M491.1 92 H674.1"/>
  <rect class="mark" opacity=".7" x="580.4" y="89.6" width="4.8" height="4.8"/>
  <text class="t lbl muted" x="0" y="126">Model C</text>
  <path class="stroke" stroke-width="1.5" stroke-linecap="round" opacity=".65" d="M562.1 122 H748.0"/>
  <rect class="mark" opacity=".7" x="654.1" y="119.4" width="5.2" height="5.2"/>
  <text class="t lbl muted" x="0" y="156">Model D</text>
  <path class="stroke" stroke-width="1.5" stroke-linecap="round" opacity=".65" d="M441.0 152 H650.3"/>
  <rect class="mark" opacity=".7" x="543.6" y="150.0" width="4.0" height="4.0"/>
  <text class="t lbl muted" x="0" y="186">Model E</text>
  <path class="stroke" stroke-width="1.5" stroke-linecap="round" opacity=".65" d="M520.7 182 H691.3"/>
  <rect class="mark" opacity=".7" x="602.5" y="179.2" width="5.6" height="5.6"/>
  <text class="t lbl ink" x="0" y="232" style="font-weight:600">Pooled estimate</text>
  <path class="mark" d="M558.2 228 L607.8 219 L656.7 228 L607.8 237 Z"/>
  <path class="rule" d="M300.0 262 H748.0"/>
  <path class="rule" d="M378.3 262 V267"/>
  <text class="t ax muted" x="378.3" y="281" text-anchor="middle">0.25</text>
  <path class="rule" d="M526.2 262 V267"/>
  <text class="t ax muted" x="526.2" y="281" text-anchor="middle">1</text>
  <path class="rule" d="M674.1 262 V267"/>
  <text class="t ax muted" x="674.1" y="281" text-anchor="middle">4</text>
  <text class="t ax muted" x="514.2" y="302" text-anchor="end">← no benefit</text>
  <text class="t ax muted" x="538.2" y="302">favours lipid emulsion →</text>
</svg>
