<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" role="img" aria-label="Schematic of a retrospective cohort: patients share an index procedure, split into two exposure groups with differing follow-up durations and outcome times, each with a pre-index look-back window.">
  <style>
    .ink    { fill: #17191c; }
    .muted  { fill: #767c85; }
    .rule   { stroke: #e0dfda; stroke-width: 1; fill: none; }
    .hair   { stroke: #c9c8c3; stroke-width: 1; fill: none; }
    .mark   { fill: #1c4f7c; }
    .stroke { stroke: #1c4f7c; fill: none; }
    .soft   { fill: #1c4f7c; fill-opacity: .12; }
    .t      { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .lbl    { font-size: 13px; }
    .val    { font-size: 12px; font-variant-numeric: tabular-nums; }
    .ax     { font-size: 11px; }
    .cap    { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .ink    { fill: #e9e8e4; }
      .muted  { fill: #8d939b; }
      .rule   { stroke: #2a2e33; }
      .hair   { stroke: #3c4147; }
      .mark   { fill: #6fa8d6; }
      .stroke { stroke: #6fa8d6; }
      .soft   { fill: #6fa8d6; fill-opacity: .16; }
    }
  </style>
  <path class="hair" stroke-dasharray="4 4" d="M250 34 V292"/>
  <text class="t cap muted" x="250" y="24" text-anchor="middle">index procedure</text>
  <text class="t cap muted" x="0" y="24">look-back</text>
  <text class="t cap muted" x="780" y="24" text-anchor="end">follow-up</text>
  <text class="t lbl ink" x="0" y="50" style="font-weight:600">Exposure A</text>
    <rect class="mark" opacity=".18" x="190" y="62" width="60" height="8" rx="4"/>
    <rect class="mark" opacity="1.0" x="253" y="62" width="300" height="8" rx="4"/>
    <circle class="mark" opacity="1.0" cx="562" cy="66" r="4"/>
    <rect class="mark" opacity=".18" x="176" y="88" width="74" height="8" rx="4"/>
    <rect class="mark" opacity="1.0" x="253" y="88" width="356" height="8" rx="4"/>
    <circle class="mark" opacity="1.0" cx="618" cy="92" r="4"/>
    <rect class="mark" opacity=".18" x="162" y="114" width="88" height="8" rx="4"/>
    <rect class="mark" opacity="1.0" x="253" y="114" width="262" height="8" rx="4"/>
    <circle class="mark" opacity="1.0" cx="524" cy="118" r="4"/>
    <rect class="mark" opacity=".18" x="190" y="140" width="60" height="8" rx="4"/>
    <rect class="mark" opacity="1.0" x="253" y="140" width="388" height="8" rx="4"/>
    <circle class="mark" opacity="1.0" cx="650" cy="144" r="4"/>
  <text class="t lbl ink" x="0" y="198" style="font-weight:600">Exposure B</text>
    <rect class="mark" opacity=".18" x="190" y="210" width="60" height="8" rx="4"/>
    <rect class="mark" opacity="0.42" x="253" y="210" width="214" height="8" rx="4"/>
    <circle class="mark" opacity="0.42" cx="476" cy="214" r="4"/>
    <rect class="mark" opacity=".18" x="176" y="236" width="74" height="8" rx="4"/>
    <rect class="mark" opacity="0.42" x="253" y="236" width="178" height="8" rx="4"/>
    <circle class="mark" opacity="0.42" cx="440" cy="240" r="4"/>
    <rect class="mark" opacity=".18" x="162" y="262" width="88" height="8" rx="4"/>
    <rect class="mark" opacity="0.42" x="253" y="262" width="262" height="8" rx="4"/>
    <circle class="mark" opacity="0.42" cx="524" cy="266" r="4"/>
    <rect class="mark" opacity=".18" x="190" y="288" width="60" height="8" rx="4"/>
    <rect class="mark" opacity="0.42" x="253" y="288" width="198" height="8" rx="4"/>
    <circle class="mark" opacity="0.42" cx="460" cy="292" r="4"/>
  <path class="rule" d="M0 300 H780"/>
  <text class="t ax muted" x="0" y="322">Same index event, two exposure patterns, one outcome window</text>
</svg>
