<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-label="Funnel plot of adverse-event reports with an outlying safety signal">
  <style>
    .bg   { fill: #8a5a2b; opacity: .05; }
    .rule { stroke: #8a5a2b; opacity: .35; stroke-width: 1.25; fill: none; }
    .ci   { stroke: #8a5a2b; opacity: .5; stroke-width: 1.25; fill: none; stroke-dasharray: 5 4; }
    .pt   { fill: #8a5a2b; opacity: .38; }
    .sig  { fill: #8a5a2b; opacity: .95; }
    .lbl  { fill: #8a5a2b; opacity: .8; font: 600 11px -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .08em; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #cf9a5f; opacity: .07; }
      .rule, .ci { stroke: #cf9a5f; }
      .pt, .sig, .lbl { fill: #cf9a5f; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="600" height="240"/>

  <!-- axes -->
  <path class="rule" d="M60 200 H545"/>
  <path class="rule" d="M60 200 V32"/>

  <!-- funnel confidence limits -->
  <path class="ci" d="M300 40 L120 196"/>
  <path class="ci" d="M300 40 L480 196"/>
  <path class="rule" d="M300 40 V200" opacity=".2"/>

  <!-- point cloud inside the funnel -->
  <g class="pt">
    <circle cx="298" cy="60"  r="4"/><circle cx="316" cy="72"  r="3.4"/>
    <circle cx="282" cy="80"  r="3.6"/><circle cx="330" cy="94"  r="4.2"/>
    <circle cx="264" cy="98"  r="3.2"/><circle cx="345" cy="112" r="3.8"/>
    <circle cx="252" cy="118" r="4"/>  <circle cx="360" cy="128" r="3.4"/>
    <circle cx="238" cy="132" r="3.6"/><circle cx="376" cy="140" r="4.4"/>
    <circle cx="222" cy="146" r="3.2"/><circle cx="392" cy="152" r="3.6"/>
    <circle cx="206" cy="158" r="4"/>  <circle cx="410" cy="164" r="3.2"/>
    <circle cx="188" cy="170" r="3.4"/><circle cx="430" cy="176" r="4"/>
    <circle cx="168" cy="182" r="3.8"/><circle cx="452" cy="186" r="3.4"/>
    <circle cx="146" cy="192" r="3.2"/><circle cx="474" cy="194" r="3.8"/>
    <circle cx="308" cy="106" r="3"/>  <circle cx="290" cy="134" r="3"/>
    <circle cx="336" cy="160" r="3"/>  <circle cx="268" cy="168" r="3"/>
  </g>

  <!-- outlying signals beyond the limits -->
  <g class="sig">
    <circle cx="506" cy="150" r="6"/>
    <circle cx="524" cy="118" r="5"/>
    <circle cx="112" cy="126" r="5.5"/>
  </g>
  <path class="rule" d="M506 150 m10 0 h20" opacity=".7"/>
  <text class="lbl" x="540" y="154" text-anchor="end" opacity="0">signal</text>

  <!-- axis labels -->
  <text class="lbl" x="60" y="222">REPORTING ODDS RATIO</text>
  <text class="lbl" x="18" y="40" transform="rotate(-90 18 40)">REPORTS</text>
</svg>
