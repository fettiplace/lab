<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" aria-label="Forest plot: reporting odds ratio of cardiac arrest by anesthetic drug class. Reversal agents 2.00, paralytics 1.37 and volatile agents 1.25 sit above 1.0; IV anesthetics 0.90, amide-linked local anesthetics 0.64, ester-linked local anesthetics 0.41, opioids 0.33 and anti-emetics 0.19 sit below.">
  <style>
    .ink    { fill: #17191c; }
    .muted  { fill: #767c85; }
    .rule   { stroke: #e0dfda; stroke-width: 1; fill: none; }
    .hair   { stroke: #c9c8c3; stroke-width: 1; fill: none; }
    .mark   { fill: #1c4f7c; }
    .stroke { stroke: #1c4f7c; fill: none; }
    .soft   { fill: #1c4f7c; fill-opacity: .12; }
    .t      { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .lbl    { font-size: 13px; }
    .val    { font-size: 12px; font-variant-numeric: tabular-nums; }
    .ax     { font-size: 11px; }
    .cap    { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .ink    { fill: #e9e8e4; }
      .muted  { fill: #8d939b; }
      .rule   { stroke: #2a2e33; }
      .hair   { stroke: #3c4147; }
      .mark   { fill: #6fa8d6; }
      .stroke { stroke: #6fa8d6; }
      .soft   { fill: #6fa8d6; fill-opacity: .16; }
    }
  </style>
  <path class="hair" d="M605.6 34 V312" stroke-dasharray="4 4"/>
  <text class="t ax muted" x="605.6" y="28" text-anchor="middle">no signal</text>
  <g>
